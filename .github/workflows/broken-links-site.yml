name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

jobs:
  check-links-on-site:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install ImageMagick 🖼️
        # needed by jekyll-imagemagick to generate the responsive .webp images; newer runner images don't ship it
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          if ! command -v convert >/dev/null && command -v magick >/dev/null; then
            printf '#!/bin/sh\nexec magick "$@"\n' | sudo tee /usr/local/bin/convert >/dev/null && sudo chmod +x /usr/local/bin/convert
          fi
          convert -version | head -1
      - name: Install and Build 🔧
        run: |
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build --lsi
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # only check local links
          args: --offline --remap '_site(/?.*)/assets/(.*) _site/assets/$2' --verbose --no-progress '_site/**/*.html'
      - name: Report broken links as annotations 📋
        if: ${{ failure() }}
        run: |
          [ -f lychee/out.md ] || exit 0
          grep -E '^\* \[(ERR|[0-9]{3}|TIMEOUT)\]|^\* \[✗\]|\[ERROR\]|\[ERR\]' lychee/out.md | head -50 | while IFS= read -r line; do echo "::warning::$line"; done
          grep -E '^### Errors in ' lychee/out.md | head -50 | while IFS= read -r line; do echo "::warning::$line"; done
